name: Frontend Build

on:
  push:
    branches:
      - main
      - "design/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install dependencies and build assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build
